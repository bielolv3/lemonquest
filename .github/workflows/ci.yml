name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
      - name: Bundle do servidor existe e sobe
        run: |
          test -s packages/server/dist/server.mjs
          test -s packages/server/dist/admin.mjs

  docker:
    name: Docker build (sem push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lemonquest:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container sobe e responde /health
        run: |
          docker run -d --name lq -p 2567:2567 lemonquest:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:2567/health && exit 0; sleep 2; done
          docker logs lq; exit 1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: hashFiles('playwright.config.ts') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
